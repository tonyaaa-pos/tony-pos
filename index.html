  <body class="font-sans antialiased text-slate-900 bg-slate-50 dark:bg-slate-950 dark:text-slate-100 select-none">
    <noscript>กรุณาเปิดใช้งาน JavaScript</noscript>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && (!r.children || !r.children.length)) {
          r.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0f172a;color:#f8fafc;font-family:sans-serif">' +
            '<div style="max-width:440px;width:100%;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:24px;box-shadow:0 10px 25px rgba(0,0,0,0.5)">' +
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
            '<div style="width:40px;height:40px;border-radius:12px;background:rgba(245,158,11,0.15);color:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold">⚠️</div>' +
            '<div><h3 style="margin:0;font-size:16px;font-weight:bold">ระบบ KinD POS</h3><p style="margin:2px 0 0;font-size:12px;color:#94a3b8">กำลังเตรียมความพร้อมของแอปพลิเคชัน</p></div>' +
            '</div>' +
            '<p style="font-size:12px;color:#cbd5e1;line-height:1.5;margin:0 0 16px">' + (e.message || 'หากหน้าจอค้าง กรุณากดปุ่มด้านล่างเพื่อเริ่มระบบใหม่') + '</p>' +
            '<button onclick="localStorage.removeItem(\'kind_pos_screen_role\');location.reload()" style="width:100%;padding:10px 16px;background:#f59e0b;color:#0f172a;font-weight:bold;font-size:13px;border:none;border-radius:10px;cursor:pointer">รีเฟรชหน้าจอใหม่</button>' +
            '</div></div>';
        }
      }, true);
    </script>
    <!-- Vite entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
